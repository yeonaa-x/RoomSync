<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Book Your Stay - RoomSync</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/privateroom.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="#!">RoomSync</a>
            <form class="d-flex">
                <button class="btn btn-outline-dark" type="button">
                    Bookings
                    <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                </button>
            </form>
        </div>
    </nav>
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">RoomSync</h1>
                <p class="lead fw-normal text-white-50 mb-0">Book Your Perfect Space with Ease</p>
            </div>
        </div>
    </header>
    <section class="py-5">
        <div class="container">
            <h1 class="my-4">Booking Form</h1>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow">
                        <div class="card-header bg-black text-white text-center">
                            <h2 class="mb-0">Book Your Stay</h2>
                        </div>
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="roomType" class="form-label">What would you like to book?</label>
                                    <select class="form-select" id="roomType" required>
                                        <option value="" disabled selected>Select an option</option>
                                        <option value="entirehome">Entire Homes</option>
                                        <option value="privateroom">Private Rooms</option>
                                        <option value="studio">Studios</option>
                                        <option value="luxuryvilla">Luxury Villas</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="contact" class="form-label">Contact Number</label>
                                    <input type="tel" class="form-control" id="contact" required pattern="[0-9]{11}" placeholder="09XXXXXXXXX">
                                </div>
                                <div class="mb-3">
                                    <label for="startDate" class="form-label">Booking Start Date</label>
                                    <input type="date" class="form-control" id="startDate" required>
                                </div>
                                <div class="mb-3">
                                    <label for="endDate" class="form-label">Booking End Date</label>
                                    <input type="date" class="form-control" id="endDate" required>
                                </div>
                                <div class="mb-3">
                                    <label for="guests" class="form-label">Number of Guests</label>
                                    <input type="number" class="form-control" id="guests" min="1" max="999" required>
                                </div>
                                <button type="button" id="showConfirmationBtn" class="btn btn-outline-dark bg-white w-100 fw-bold">Confirm Booking</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; RoomSync 2025</p></div>
    </footer>
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="bookingModalLabel">Book Your Stay</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="roomType" class="form-label">What would you like to book?</label>
            <select class="form-select" id="roomType" required>
              <option value="" disabled selected>Select an option</option>
              <option value="entirehome">Entire Homes</option>
              <option value="privateroom">Private Rooms</option>
              <option value="studio">Studios</option>
              <option value="luxuryvilla">Luxury Villas</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label for="contact" class="form-label">Contact Number</label>
            <input type="tel" class="form-control" id="contact" required pattern="[0-9]{11}" placeholder="09XXXXXXXXX">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="startDate" class="form-label">Booking Start Date</label>
            <input type="date" class="form-control" id="startDate" required>
          </div>
          <div class="mb-3">
            <label for="endDate" class="form-label">Booking End Date</label>
            <input type="date" class="form-control" id="endDate" required>
          </div>
          <div class="mb-3">
            <label for="guests" class="form-label">Number of Guests</label>
            <input type="number" class="form-control" id="guests" min="1" max="999" required>
          </div>
            <button type="submit" class="btn btn-outline-dark bg-white w-100 fw-bold">Confirm Booking</button>        </form>
      </div>
    </div>
  </div>
</div>
    <!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="confirmationModalLabel">Confirm Your Booking</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul class="list-group mb-3" id="confirmationDetails"></ul>
        <button id="finalConfirmBtn" class="btn btn-success w-100">Confirm</button>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script type="module">
    import { setupDateValidation } from './js/room.js';   
    setupDateValidation('startDate', 'endDate');
  </script>
  <script type="module">
  import { setupBookingSubmission, setupMainFormToModalSync } from './js/booking.js';
  setupBookingSubmission('#bookingModal form');
  setupMainFormToModalSync();
</script>
</body>
</html>
