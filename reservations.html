<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reservations</title>
  <!-- Bootstrap for styling (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Reservations</h1>
    <table class="table table-bordered" id="reservationsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Room Type</th>
          <th>Guests</th>
          <th>Start Date</th>
          <th>End Date</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be inserted here -->
      </tbody>
    </table>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // Use the same config as in booking.js
    const firebaseConfig = {
      apiKey: "AIzaSyB5L9hv2MXY30hMCYEaVn_EdXRNTEdXZfc",
      authDomain: "roomsync-sia101.firebaseapp.com",
      projectId: "roomsync-sia101",
      storageBucket: "roomsync-sia101.appspot.com",
      messagingSenderId: "279983739273",
      appId: "1:279983739273:web:0808152771eb01e181d158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fetch bookings from Firestore
    async function loadBookings() {
      const tbody = document.querySelector("#reservationsTable tbody");
      tbody.innerHTML = "<tr><td colspan='7'>Loading...</td></tr>";
      const querySnapshot = await getDocs(collection(db, "bookings"));
      tbody.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${data.name || ""}</td>
          <td>${data.contact || ""}</td>
          <td>${data.email || ""}</td>
          <td>${data.roomType || ""}</td>
          <td>${data.guests || ""}</td>
          <td>${data.startDate || ""}</td>
          <td>${data.endDate || ""}</td>
        `;
        tbody.appendChild(row);
      });
      if (tbody.innerHTML === "") {
        tbody.innerHTML = "<tr><td colspan='7'>No reservations found.</td></tr>";
      }
    }

    loadBookings();
  </script>
</body>
</html>
