<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Reservations - RoomSync</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/privateroom.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; min-height: 100vh; }
      main { flex: 1 0 auto; }
      footer { flex-shrink: 0; }
    </style>
</head>
<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand" href="home.html">RoomSync</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="room.html">Room</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="roomsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Room Types
              </a>
              <ul class="dropdown-menu" aria-labelledby="roomsDropdown">
                <li><a class="dropdown-item" href="privateroom.html">Private Room</a></li>
                <li><a class="dropdown-item" href="studioroom.html">Studio Room</a></li>
                <li><a class="dropdown-item" href="entirehome.html">Entire Home</a></li>
                <li><a class="dropdown-item" href="luxuryvilla.html">Luxury Villa</a></li>
              </ul>
            </li>
          </ul>
          <form class="d-flex">
            <button id="logoutBtn" class="btn btn-danger ms-2" type="button">Logout</button>
          </form>
        </div>
      </div>
    </nav>
    <main>
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Your Reservations</h1>
                    <p class="lead fw-normal text-white-50 mb-0">View and manage your bookings</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            <div class="container">
                <div class="card mb-4">
                    <div class="card-header">
                        <h2 class="my-3">Reservations</h2>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered" id="reservationsTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                    <th>Room Type</th>
                                    <th>Guests</th>
                                    <th>Start Date</th>
                                    <th>End Date</th>
                                    <th>Payment Method</th>
                                    <th>GCash Ref #</th>
                                    <th>Cancel Booking</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; RoomSync 2025</p>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import { loadBookings } from "./js/loadBookings.js";

        const auth = getAuth();
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadBookings(user.email);
            } else {
                window.location.href = "login.html";
            }
        });

        // Bookings button navigation
        document.addEventListener('DOMContentLoaded', function() {
            const bookingsBtn = document.getElementById('bookingsBtn');
            if (bookingsBtn) {
                bookingsBtn.addEventListener('click', function() {
                    window.location.href = 'reservations.html';
                });
            }
        });

        // Logout button
        import { signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        document.addEventListener('DOMContentLoaded', function() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function() {
                    await signOut(auth);
                    window.location.href = "login.html";
                });
            }
        });
    </script>
</body>
</html>
